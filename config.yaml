# ============================================
# THE DAILY BYTE - Configuração v2.3
# Atualizado: 2026-02-22 (Tier 1 Expansion — 92 novas fontes Pulse.bot)
# ============================================

newsletter:
  name: "THE DAILY BYTE"
  tagline: "News, insights & trends"
  author: "Totó Busnello"
  email: "lab@nuvini.ai"
  landing_page: "buttondown.com/totobusnello"

# Horário de envio (BRT)
schedule:
  time: "08:00"
  timezone: "America/Sao_Paulo"

# Filtros de curadoria
filters:
  # Idade máxima das notícias
  max_age_hours: 24
  # Idade máxima para newsletters/substacks (janela maior)
  max_age_hours_newsletters: 36

  # Score mínimo para entrar (0-100)
  min_heat_score: 60

  # Máximo de itens no digest (main sections + quick links)
  max_items: 18

  # Distribuição por categoria (novo layout consolidado v2.1)
  distribution:
    world: 3              # Mundo Real (mundo + Brasil)
    hoje_no_byte: 5       # Consolidação: breaking + ai_models + big_tech
    saas_enterprise: 2    # SaaS, valuations, CapEx
    tool_of_day: 1        # 1 ferramenta prática + prompt "Como Usar"
    watch_later: 1        # 1 vídeo essencial
    quick_links: 6        # Links rápidos no final (headline + link only)

# Temas prioritários (boost no score)
themes:
  priority:
    - "agentic engineering"
    - "agent swarms"
    - "foundation models"
    - "AI safety"
    - "enterprise AI"
    - "Claude"
    - "GPT"
    - "LLM"
    - "SaaS"
    - "CapEx"
    - "valuations"
    - "Brasil"
    - "regulação AI"
    - "plugins"
    - "MCP"

  # Keywords que indicam hype vazio (penalidade)
  penalty:
    - "vai revolucionar"
    - "mudará tudo"
    - "10 prompts"
    - "você não vai acreditar"
    - "isso muda tudo"

# APIs (usar variáveis de ambiente)
apis:
  anthropic:
    model: "claude-sonnet-4-6"
    max_tokens: 8192

  buttondown:
    api_url: "https://api.buttondown.email/v1/emails"
    # API key via BUTTONDOWN_API_KEY env var

  x_twitter:
    # Bearer token via X_BEARER_TOKEN env var
    rate_limit_per_15min: 15

