name: Notify Forge on CI Failure

on:
  workflow_run:
    # O nome tem que bater EXATO com o `name:` do daily-byte.yml, emoji incluso.
    # Sem o 🔥 o match falhava em silencio e este workflow nunca disparou.
    workflows: ["🔥 THE DAILY BYTE - Daily Digest"]
    types: [completed]

jobs:
  notify-forge:
    if: \${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Forge
        run: |
          curl -sf -X POST http://187.77.234.79:18789/hooks/github \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer \${{ secrets.OPENCLAW_WEBHOOK_SECRET }}" \
            -d "{
              \\"action\\": \\"create_flow\\",
              \\"goal\\": \\"CI workflow '\${{ github.event.workflow_run.name }}' failed on \${{ github.repository }} (branch: \${{ github.event.workflow_run.head_branch }}). Run: \${{ github.event.workflow_run.html_url }}. Investigate and fix.\\",
              \\"status\\": \\"queued\\"
            }"
