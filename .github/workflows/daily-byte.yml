name: 🔥 THE DAILY BYTE - Daily Digest

on:
  # ALVO DE ENTREGA: 06:45 BRT (09:45 UTC). Trabalhando de tras para frente,
  # com medicao de 10 runs agendados (17-26/08):
  #
  #   cron 09:07 UTC + fila do GH (mediana 35min, faixa 29-43) + pipeline
  #   (mediana 3,5min) = email por volta de 09:45 UTC = 06:45 BRT.
  #
  # Faixa realista de entrega: 06:38 a 06:53 BRT.
  #
  # ⚠️ A fila do GH Actions NAO e confiavel: 2 dos ultimos 12 runs agendados
  # atrasaram 8h e 11h. Nenhum cron corrige isso. Se 06:45 virar requisito
  # duro, a saida e disparar por `workflow_dispatch` a partir de um scheduler
  # externo (a VPS Hostinger ja tem cron) — dispatch comeca em 0s, medido em
  # 5 de 5 runs. Ai o cron daqui vira so rede de seguranca.
  #
  # ⚠️ CRITICO — QUEM empurra este arquivo importa mais que o horario.
  #
  # O GitHub atribui o evento `schedule` ao ator que por ultimo empurrou o
  # arquivo do workflow para o default branch. Se esse ator for um GitHub App
  # (`app/claude`, `github-actions[bot]`, etc), o evento NAO e entregue — e a
  # mesma protecao anti-recursao que impede push com GITHUB_TOKEN de disparar
  # workflow. Nao ha identidade de usuario para atribuir o run agendado.
  #
  # Foi exatamente isso que matou o schedule entre 28/08 e 31/08 de 2026: o
  # PR #20 (mudanca do cron) foi autorado E mergeado por `app/claude`, e daquele
  # dia em diante nenhum run agendado saiu. Os PRs #25/#26/#27 (delete →
  # recreate → rename) tentaram forcar o re-registro — receita correta, ator
  # errado: rodaram pelo proprio App e re-registraram o cron com o mesmo
  # problema, tres vezes.
  #
  # REGRA: toda mudanca neste arquivo tem que ser empurrada por um HUMANO,
  # commit direto na main, com credencial pessoal. Nunca via PR do Claude/bot.
  # Diagnostico: `gh pr view <n> --json author,mergedBy` — se author e mergedBy
  # forem `app/...`, o schedule morreu naquele commit.
  #
  # (A hipotese anterior — de que o minuto ':00' seria descartado por
  # congestionamento — estava errada. O cron '0 6 * * *' rodou todo dia por
  # meses, com fila de 29-43 min. Minuto impar e inofensivo, mas nao era o
  # problema; o horario aqui e escolhido pelo alvo de entrega, nao por isso.)
  schedule:
    - cron: '07 9 * * *'

  # Permite executar manualmente
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Apenas preview (não envia email)'
        required: false
        default: 'false'
        type: boolean

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
  X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

jobs:
  generate-digest:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt

      # v2.9: Restore dedup caches (URLs + title hashes) from previous runs
      - name: 🔄 Restore dedup cache
        uses: actions/cache@v5
        with:
          path: |
            /tmp/digest_sent_cache.json
            /tmp/digest_sent_titles.json
          key: digest-dedup-${{ github.run_number }}
          restore-keys: |
            digest-dedup-

      # v2.10: Restore raw data cache (fallback if collection fails)
      - name: 🔄 Restore raw data cache
        uses: actions/cache@v4
        with:
          path: /tmp/digest_raw.json
          key: digest-raw-latest-${{ github.run_number }}
          restore-keys: |
            digest-raw-latest-

      # v2.16: Restore feed health state. Sem isso o contador de falhas
      # consecutivas reiniciava a cada run e o alerta (threshold=3) nunca disparava.
      - name: 🔄 Restore feed health cache
        uses: actions/cache@v4
        with:
          path: /tmp/digest_feed_health.json
          key: digest-health-${{ github.run_number }}
          restore-keys: |
            digest-health-

      # v2.16: o suite estava quebrado desde a v2.14 (referenciava funções
      # removidas) e ninguém percebeu, porque nada o executava. Agora roda a
      # cada edição — e falha o build se quebrar.
      - name: 🧪 Testes unitários
        run: |
          cd scripts && python test_byte_score.py

      - name: 🏥 Health check feeds
        id: health
        continue-on-error: true
        run: |
          cd scripts && python health_check.py

      # v2.16: Persist feed health state para a próxima run
      - name: 💾 Save feed health cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/digest_feed_health.json
          key: digest-health-${{ github.run_number }}

      - name: 📰 Step 1 — Collect news sources
        id: collect
        run: |
          cd scripts
          python collector.py
          echo "✅ Collection complete"

      # v2.10: Save raw data to cache after successful collection
      - name: 💾 Save raw data cache
        if: steps.collect.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /tmp/digest_raw.json
          key: digest-raw-latest-${{ github.run_number }}

      # v2.4: Feedback loop — engagement metrics inform curation (non-critical)
      - name: 📊 Step 2 — Collect feedback metrics
        id: feedback
        run: |
          cd scripts
          python -c "from feedback import collect_feedback; collect_feedback()" || echo "⚠️ Feedback skipped (non-critical)"
          echo "✅ Feedback complete"

      - name: 🤖 Step 3 — Curate with Claude AI
        id: curate
        run: |
          cd scripts
          python processor.py
          echo "✅ Curation complete"

      - name: 📧 Step 4 — Send digest
        id: send
        if: ${{ github.event.inputs.preview_only != 'true' }}
        run: |
          cd scripts
          python sender.py
          echo "✅ Email sent!"

      - name: 👀 Step 4 — Preview only (no send)
        if: ${{ github.event.inputs.preview_only == 'true' }}
        run: |
          cd scripts
          python sender.py --preview
          echo "📋 Preview generated (email NOT sent)"

      # Registra qual step falhou para o alerta
      - name: 🔍 Detect failed step
        if: failure()
        run: |
          if [ "${{ steps.collect.outcome }}" = "failure" ]; then
            echo "FAILED_STEP=📰 Coleta (collector.py)" >> $GITHUB_ENV
          elif [ "${{ steps.curate.outcome }}" = "failure" ]; then
            echo "FAILED_STEP=🤖 Curadoria (processor.py)" >> $GITHUB_ENV
          elif [ "${{ steps.send.outcome }}" = "failure" ]; then
            echo "FAILED_STEP=📧 Envio (sender.py)" >> $GITHUB_ENV
          else
            echo "FAILED_STEP=❓ Step desconhecido" >> $GITHUB_ENV
          fi

      - name: 📊 Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: digest-${{ github.run_number }}
          path: |
            /tmp/digest_raw.json
            /tmp/digest_curated.json
            /tmp/digest_preview.md
            /tmp/digest_preview.html
            /tmp/digest_feedback.json
            /tmp/digest_sent_cache.json
            /tmp/digest_sent_titles.json
            /tmp/digest_feed_health.json
          retention-days: 7

  # ── v2.5: Alerta via GitHub Issue se o pipeline falhar ──
  notify-failure:
    runs-on: ubuntu-latest
    needs: generate-digest
    if: failure()
    permissions:
      issues: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🚨 Create failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/alert_failure.py \
            --run-id "${{ github.run_id }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --failed-step "${{ env.FAILED_STEP || 'Ver logs para detalhes' }}"
