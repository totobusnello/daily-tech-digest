name: 🔥 THE DAILY BYTE - Daily Digest

on:
  # Executa todo dia às 09:45 UTC (06:45 BRT) - margem para fila de runners
  schedule:
    - cron: '45 9 * * *'

  # Permite executar manualmente
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Apenas preview (não envia email)'
        required: false
        default: 'false'
        type: boolean

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
  X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

jobs:
  generate-digest:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt

      # v2.3: Restore dedup cache from previous runs
      - name: 🔄 Restore dedup cache
        uses: actions/cache@v4
        with:
          path: /tmp/digest_sent_cache.json
          key: digest-dedup-${{ github.run_number }}
          restore-keys: |
            digest-dedup-

      - name: 📰 Collect news sources
        run: |
          cd scripts
          python collector.py
          echo "✅ Collection complete"

      # v2.4: Feedback loop — engagement metrics inform curation
      - name: 📊 Collect feedback metrics
        run: |
          cd scripts
          python -c "from feedback import collect_feedback; collect_feedback()" || echo "⚠️ Feedback skipped (non-critical)"
          echo "✅ Feedback complete"

      - name: 🤖 Curate with Claude AI
        run: |
          cd scripts
          python processor.py
          echo "✅ Curation complete"

      - name: 📧 Send digest
        if: ${{ github.event.inputs.preview_only != 'true' }}
        run: |
          cd scripts
          python sender.py
          echo "✅ Email sent!"

      - name: 👀 Preview only (no send)
        if: ${{ github.event.inputs.preview_only == 'true' }}
        run: |
          cd scripts
          python sender.py --preview
          echo "📋 Preview generated (email NOT sent)"

      - name: 📊 Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-${{ github.run_number }}
          path: |
            /tmp/digest_raw.json
            /tmp/digest_curated.json
            /tmp/digest_preview.md
            /tmp/digest_preview.html
            /tmp/digest_feedback.json
            /tmp/digest_sent_cache.json
          retention-days: 7

  # ── v2.3: Alerta por email se o pipeline falhar ──
  notify-failure:
    runs-on: ubuntu-latest
    needs: generate-digest
    if: failure()

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🚨 Send failure alert via Buttondown
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          python scripts/alert_failure.py \
            --run-id "${{ github.run_id }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
